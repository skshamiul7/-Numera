{% extends "base.html" %}
{% block title %}GCD (Euclidean){% endblock %}
{% block content %}
<div class="tool-container">
    <h2 class="tool-title">Greatest Common Divisor</h2>
    <p class="tool-desc">Using the Euclidean algorithm. Enter two integers.</p>
    <form method="post" class="tool-form">
        {% csrf_token %}
        <div class="form-group">
            <label for="a">First number:</label>
            <input type="number" id="a" name="a" placeholder="e.g. 48" required>
        </div>
        <div class="form-group">
            <label for="b">Second number:</label>
            <input type="number" id="b" name="b" placeholder="e.g. 18" required>
        </div>
        <button type="submit" class="btn-primary">Calculate GCD</button>
    </form>
    {% if result %}
        <div class="result-box result-success">
            <p>{{ result }}</p>
        </div>
    {% endif %}
</div>
{% endblock %}
