{% extends "tools/_tool_layout.html" %}
{% block form_fields %}
<div class="form-group"><label>Shape:</label>
<select name="shape" class="form-select" required>
<option value="circle">Circle (use a = radius)</option>
<option value="rectangle">Rectangle (a = length, b = width)</option>
<option value="triangle">Triangle (a = base, b = height)</option>
<option value="square">Square (a = side)</option>
</select></div>
<div class="form-group"><label>a:</label><input type="number" step="any" name="a" required></div>
<div class="form-group"><label>b (if needed):</label><input type="number" step="any" name="b"></div>
{% endblock %}
