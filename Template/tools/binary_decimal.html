{% extends "tools/_tool_layout.html" %}
{% block form_fields %}
<div class="form-group"><label>Mode:</label>
<select name="mode" class="form-select" required>
<option value="b2d">Binary → Decimal</option>
<option value="d2b">Decimal → Binary</option>
</select></div>
<div class="form-group"><label>Value:</label><input type="text" name="value" placeholder="e.g. 1010 or 10" required></div>
{% endblock %}
