{% extends "base.html" %}
{% block title %}Even or Odd{% endblock %}
{% block content %}
<div class="tool-container">
    <h2 class="tool-title">Even or Odd Checker</h2>
    <p class="tool-desc">Enter a number to check if it's even or odd.</p>
    <form method="post" class="tool-form">
        {% csrf_token %}
        <div class="form-group">
            <label for="number">Number:</label>
            <input type="number" id="number" name="number" placeholder="e.g. 42" required>
        </div>
        <button type="submit" class="btn-primary">Check</button>
    </form>
    {% if result %}
        <div class="result-box {% if 'even' in result|lower %}result-success{% else %}result-info{% endif %}">
            <p>{{ result }}</p>
        </div>
    {% endif %}
</div>
{% endblock %}
